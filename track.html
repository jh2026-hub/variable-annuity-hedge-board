<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="robots" content="noindex"/>
<title>헷지 실적 추적판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#E9ECF3;--panel:#FFFFFF;--panel2:#EEF1F7;--hair:#DEE3EE;--ink:#16202F;--muted:#566275;
        --pay:#5C82CF;--leak:#D69A55;--sym:#9282DC;--bad:#D6738A;--good:#4FAE8C;
        --good-ink:#337A5F;--pay-ink:#4A6FC4;--bad-ink:#B8455F;--leak-ink:#A96A1C;--sym-ink:#5B4CA8;
        --good-bg:#EAF7F1;--bad-bg:#FBEEF1;--leak-bg:#FBF4E8;--pay-bg:#EEF3FE}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:"IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
       font-variant-numeric:tabular-nums;
       padding:12px 11px 56px;max-width:880px;margin:0 auto;line-height:1.55;word-break:keep-all}
  svg text{font-family:"IBM Plex Sans KR",system-ui,sans-serif}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--pay-ink)}
  code{font-family:inherit;font-size:inherit;background:var(--panel2);border:1px solid var(--hair);
       border-radius:3px;padding:0 4px;color:var(--ink)}
  .top{display:flex;align-items:center;gap:9px}
  .back{display:inline-flex;align-items:center;min-height:32px;padding:4px 11px;border-radius:999px;
        background:var(--panel);border:1px solid var(--hair);color:var(--muted);font-size:11px;font-weight:600;text-decoration:none}
  h1{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .ctx{position:sticky;top:0;z-index:20;background:var(--bg);padding:7px 0 8px;margin-top:7px;border-bottom:1px solid var(--hair)}
  .ctx .who{font-size:11px;font-weight:600;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lnk{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;background:var(--panel);border:1px solid #9DBBF3;
       border-radius:11px;padding:8px 11px;margin-top:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .lnk b{color:var(--ink);font-size:11px}
  .ctx .who b{color:var(--ink)}
  .ctx .seg{display:flex;width:100%;margin-top:6px;background:var(--panel);border:1px solid var(--hair);border-radius:9px;overflow:hidden}
  .ctx .seg button{flex:1 1 0;min-width:0;border:0;background:none;font-family:inherit;font-size:11px;font-weight:700;
        color:var(--muted);padding:8px 4px;min-height:38px;cursor:pointer}
  .ctx .seg button+button{border-left:1px solid var(--hair)}
  .ctx .seg button.on{background:#E7EFFD;color:var(--pay-ink)}
  .src,.bdg{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;vertical-align:1px;
        white-space:nowrap;letter-spacing:.01em}
  .src.real,.bdg.good{background:var(--good-bg);color:var(--good-ink)}
  .src.model,.bdg.pay{background:var(--pay-bg);color:var(--pay-ink)}
  .src.assume,.bdg.leak{background:var(--leak-bg);color:var(--leak-ink)}
  .bdg.sym{background:#F1EEFB;color:var(--sym-ink)} .bdg.bad{background:var(--bad-bg);color:var(--bad-ink)}
  .bdg.ink{background:var(--panel2);color:var(--muted)}
  .page{display:none}.page.on{display:block}
  .panel{background:var(--panel);border:1px solid var(--hair);border-radius:11px;padding:12px;margin-top:10px}
  .cap{font-size:12.5px;font-weight:800;margin-bottom:6px;padding-left:11px;position:relative;line-height:1.35}
  .cap::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:2px;background:var(--pay)}
  .cap span{font-weight:400;color:var(--muted);font-size:11px;margin-left:5px}
  .lede{color:var(--muted);font-size:10px;line-height:1.5}
  .lede b{color:var(--ink);font-weight:600}
  .foot{color:var(--muted);font-size:11px;line-height:1.5}
  .hero{position:relative;border-radius:11px;padding:12px 12px 12px 17px;margin-top:10px;
        background:var(--panel);border:1px solid var(--hair);overflow:hidden}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--good)}
  .hero.warn::before{background:var(--leak)} .hero.bad::before{background:var(--bad)}
  .hero .hl{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;font-weight:600;color:var(--muted)}
  .hero .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:11px}
  .hero.ok .tag{background:var(--good-bg);color:var(--good-ink)}
  .hero.warn .tag{background:var(--leak-bg);color:var(--leak-ink)}
  .hero.bad .tag{background:var(--bad-bg);color:var(--bad-ink)}
  .hero .big,.kpi{font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:4px 0 2px;
        font-variant-numeric:tabular-nums}
  .kpi{margin:6px 0 2px}
  .kpi small,.hero .big small{font-size:10px;color:var(--muted);font-weight:600;margin-left:2px;letter-spacing:0}
  .hero .sub{font-size:10px;color:var(--muted);line-height:1.6}.hero .sub b{color:var(--ink)}
  .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:3px;margin-top:8px}
  .flow .cell{background:var(--panel);border:1px solid var(--hair);border-radius:9px;padding:8px 5px;text-align:center;min-width:0;overflow:hidden}
  .flow .k{font-size:10px;color:var(--muted);font-weight:600}
  .flow .v{font-size:13.5px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
  .flow .s{font-size:9px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chartwrap svg{width:100%;display:block;overflow:visible;touch-action:pan-y}
  .wf{margin-top:8px}
  .wfr{display:grid;grid-template-columns:80px minmax(0,1fr) 58px;align-items:center;gap:8px;padding:6px 0}
  .wfr .wl{font-size:11px;line-height:1.35;color:var(--muted);text-align:right;word-break:keep-all}
  .wfr .wb{position:relative;height:16px;background:#F1F4F9;border-radius:3px;overflow:hidden}
  .wfr .wb i{position:absolute;top:0;height:100%;border-radius:3px}
  .wfr .wb u{position:absolute;top:0;bottom:0;width:1.5px;background:#B6C0D0}
  .wfr .wv{font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .wfr.an{padding:9px 0}
  .wfr.an .wl{font-size:11px;font-weight:800;color:var(--ink)}
  .wfr.an .wb{height:19px;background:#E7EBF2}
  .wfr.an .wv{font-size:11px;color:var(--ink)}
  .wsec{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.01em;
        margin:12px 0 4px;padding:4px 7px;background:var(--panel2);border-radius:5px}
  .wax{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#98A2B3;
       padding-left:91px;padding-right:67px;font-variant-numeric:tabular-nums}
  @media(min-width:560px){.wfr{grid-template-columns:126px minmax(0,1fr) 74px}
    .wax{padding-left:133px;padding-right:81px}}
  .asof{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair)}
  .asof .al{font-size:11px;font-weight:600;color:var(--muted)}
  .asof .al b{color:var(--ink);font-variant-numeric:tabular-nums}
  .asof .chips{margin-left:auto}
  .asof .chip{min-height:30px;padding:4px 9px;font-size:10px}
  #axSplit td.r,#axSplit th.r{text-align:right}
  #axSplit table{margin:2px 0 4px}
  tr.sub td{background:var(--panel2);font-size:10px}
  .rd{font-size:11px;color:var(--muted);min-height:19px;padding:1px 2px 5px}
  .rd b{color:var(--ink);font-weight:700}
  table{width:100%;border-collapse:collapse;font-family:inherit;font-size:10px}
  th,td{padding:6px 4px;font-size:10px;font-family:inherit;border-bottom:1px solid var(--hair);text-align:right;white-space:nowrap}
  th{font-size:9px;color:var(--muted);font-weight:700}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  .tblwrap{overflow-x:auto;margin-top:8px}
  tr.grp td{background:var(--panel2);font-size:9px;font-weight:800;color:var(--muted);padding:5px 4px}
  .note{font-size:11px;color:var(--muted);background:var(--panel2);border:1px solid var(--hair);border-radius:9px;
        padding:8px 10px;margin-top:8px;line-height:1.5}.note b{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips.pad{margin-top:8px}
  .chip{min-height:34px;padding:6px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--hair);
        color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip.on{background:#E7EFFD;border-color:#9DBBF3;color:var(--pay-ink)}
  .grp2{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--muted);
        margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--hair)}
  .grp2.first{border-top:0;margin-top:4px;padding-top:0}
  .nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .nf{background:var(--panel2);border:1px solid var(--hair);border-radius:9px;padding:7px 9px;min-width:0}
  .nf input::-webkit-outer-spin-button,.nf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .nf input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .nf label{display:block;font-size:11px;font-weight:600;line-height:1.25}
  .nf small{display:block;color:var(--muted);font-size:9px;font-weight:400;margin-top:1px}
  .nf .row{display:flex;align-items:center;gap:4px;margin-top:5px}
  .nf button{width:28px;height:32px;border:1px solid var(--hair);background:var(--panel);border-radius:5px;
        font-family:inherit;font-size:13.5px;font-weight:700;color:var(--pay-ink);cursor:pointer;flex:0 0 auto}
  .nf input{flex:1 1 auto;min-width:0;height:32px;border:1px solid var(--hair);border-radius:5px;background:var(--panel);
        font-family:inherit;font-size:11px;font-weight:700;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
  .nf input:disabled{background:var(--panel2);color:var(--muted)}
  .nf .u{font-size:9px;color:var(--muted);flex:0 0 auto}
  .sl{margin-top:8px}
  .sl label{display:flex;justify-content:space-between;font-size:11px;font-weight:600}
  .sl label b{color:var(--pay-ink);font-variant-numeric:tabular-nums}
  .sl small{display:block;color:var(--muted);font-size:9px;font-weight:400}
  input[type=range]{width:100%;margin-top:1px;accent-color:#5C82CF;height:24px}
  @media(min-width:560px){.nums{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>

<div class="top"><a class="back" href="./index.html">←</a><h1>헷지 실적 추적판</h1></div>

<div class="ctx">

  <div class="seg">

<!-- ══════ 메인 ══════ -->

<!-- ══════ 실적 ══════ -->

<p class="foot" style="text-align:center;margin-top:14px">KOSPI · 국고 20년 실측 · 그릭·비용은 예시</p>

<script>
const _stub={set innerHTML(v){},get innerHTML(){return""},set textContent(v){},get textContent(){return""},
  className:"",value:0,style:{},classList:{toggle(){},add(){},remove(){}},
  addEventListener(){},setAttribute(){},querySelector(){return null},querySelectorAll(){return[]}};
const $=id=>{const el=document.getElementById(id); if(!el)console.warn("no #"+id); return el||_stub;};
const S={mkt:null,pnl:null,loaded:false,poolE:null,poolR:null,sdE:0,sdR:0,kAbsR:0.712};

/* ═══ 상수 ═══ */
const NPATH=2000, NFAST=300, BLK=10, VOV=0.35, TAU=63, TEFF=1.5, LAM=0.94;
const PAST=252, MAXFUT=252, CUMY="2023";
/* 리밸런싱 주기별 분산비 — 한국 실측(주식 단기 평균회귀 VR<1, 국고 장기 추세 VR>1) */
const VRE={1:1.00,2:0.93,5:0.89,10:0.83,21:1.04}, VRR={1:1.00,2:1.01,5:1.29,10:1.25,21:1.17};
function vr(T,n){const k=[1,2,5,10,21];
  if(n<=1)return T[1]; if(n>=21)return T[21];
  for(let i=1;i<k.length;i++){if(n<=k[i]){const a=k[i-1],b=k[i];return T[a]+(T[b]-T[a])*(n-a)/(b-a);}}
  return 1;}

/* ═══ 국면 — 실측 롤링60일 분위 기반 ═══ */
const REGS=[
  {id:"calm",  n:"🌤 평온", dE:1.00, dR:2.4, bs:19, te:2.9, q:"롤링σ p25"},
  {id:"base",  n:"🌥 기준", dE:1.80, dR:3.8, bs:28, te:4.7, q:"무조건부 σ · 주가 6.6년 · 금리 10.6년"},
  {id:"recent",n:"📈 최근", auto:true, dE:0, dR:0, bs:20, te:4.0, q:"최근 60일 실측"},
  {id:"storm", n:"⛈ 격변", dE:3.90, dR:8.0, bs:55, te:7.5, q:"롤링σ p99"},
];
const REG=id=>REGS.find(r=>r.id===id);
const VIEWS=[{id:"ytd",n:"당해"},{id:"3y",n:"12개월"},{id:"cum",n:"23년~"}];
let RSEL="recent", REDIT="base", VIEW="ytd", FUT=252, CURSOR=null, TAB="m";

/* ═══ 파라미터 ═══ */
const PAR=[
 {g:"규모",tb:"b", id:"av",   n:"펀드 적립금",    u:"조",     v:35,  st:1,   k:"n", s:"bp 분모"},
 {g:"규모",tb:"b", id:"bel",  n:"부채 BEL",      u:"조",     v:30,  st:1,   k:"n", s:"부채 전체"},
 {g:"규모",tb:"b", id:"unm",  n:"자산미보유 부채", u:"% BEL",  v:3.8, st:0.1, k:"n", s:"2보기·특약 등"},
 {g:"규모",tb:"b", id:"disc", n:"할인율",        u:"%",      v:3.9, st:0.1, k:"n", s:"자산이자 미상쇄분"},
 {g:"주가",tb:"b", id:"gamE", n:"감마 Γ",        u:"억/1%",  v:1.0, st:0.05,k:"n", s:"미커버 기준 · 세타와 패리티"},
 {g:"주가",tb:"b", id:"thE",  n:"옵션 세타",      u:"억/년",  v:404, st:10,  k:"n", s:"발행 시점 확정"},
 {g:"주가",tb:"r", id:"vgE",  n:"베가(숏)",      u:"억/1%p", v:200, st:10,  k:"n", s:"내재 1%p↑ 시 손실"},
 {g:"주가",tb:"b", id:"slipE",n:"델타 슬리피지",  u:"억/1억",  v:0,   st:0.01,k:"n", s:"델타 1억 조정당"},
 {g:"금리",tb:"b", id:"gamR", n:"감마 Γ",        u:"억/bp",  v:0.175,st:0.005,k:"n",s:"1bp당 컨벡시티"},
 {g:"금리",tb:"b", id:"thR",  n:"옵션 세타",      u:"억/년",  v:240, st:10,  k:"n", s:"발행 시점 확정"},

 {g:"베이시스",tb:"r", id:"bsdv", n:"본드스왑 노출",   u:"억/bp",  v:18.8, st:0.5,k:"n", s:"커버 100% 기준 · IRS20−국고10"},

 {g:"베이시스",tb:"r", id:"teDft",n:"추적오차 드리프트",u:"%/년",  v:-0.5,st:0.1,k:"n",s:"삼성 국내주식형 AUM가중 실측"},

 {g:"커버",tb:"b", id:"covE", n:"주가 커버(계획)", u:"%", v:0,  mn:0,mx:100,st:5,k:"s"},

 {g:"커버",tb:"r", id:"acovR",n:"금리 커버(실제)", u:"%", v:80, mn:0,mx:100,st:5,k:"s"},

];
const P={}; PAR.forEach(p=>P[p.id]=p.v);

const won=x=>{const a=Math.abs(x);return (x<0?"−":"")+Math.round(a).toLocaleString();};
const sgn=x=>Math.abs(x)<0.5?"≈0":(x>=0?"+":"−")+Math.round(Math.abs(x)).toLocaleString();
const bpv=x=>{const v=x/(P.av*1e4)*1e4;return (v<0?"−":"")+Math.abs(v).toFixed(1)+"bp";};
const E=x=>won(x)+"억", SE=x=>sgn(x)+"억";     /* 금액은 항상 숫자+억, 부호는 U+2212 */
const fmtd=s=>s.replace(/(\d{4})(\d\d)(\d\d)/,"$1-$2-$3");
const N=()=>252;
const C=v=>v>=0?"var(--good-ink)":"var(--bad-ink)";

/* ═══ 이론값 ═══ */
const wEp=()=>1-P.covE/100, wRp=()=>1-P.covR/100;
const wEa=()=>P.mulE*(1-P.acovE/100), wRa=()=>P.mulR*(1-P.acovR/100);
const unmat=()=>P.bel*1e4*P.unm/100;
const gYE=(w,d)=>w*0.5*P.gamE*d*d*N()*vr(VRE,P.rbal);
const gYR=(w,d)=>w*0.5*P.gamR*d*d*N()*vr(VRR,P.rbal);
const thP=()=>wEp()*P.thE+wRp()*P.thR, thA=()=>wEa()*P.thE+wRa()*P.thR;
const diE=()=>Math.sqrt(Math.max(0,2*P.thE/(P.gamE*N()))), diR=()=>Math.sqrt(Math.max(0,2*P.thR/(P.gamR*N())));
const carry=()=>P.disc*unmat()/100;
const mv=d=>d*Math.sqrt(P.rbal)*Math.sqrt(2/Math.PI);
/* 슬리피지 — 주가: 캐시델타(100Γ)×명목bp · 금리: 거래DV01(Γ)×호가bp. 두 다리 차원을 맞췄어요 */
const tcE=(w,d)=>(N()/P.rbal)*w*100*P.gamE*mv(d)*P.slipE;   /* 조정 캐시델타(100Γ) × 1억당 단가 */
const tcR=(w,d)=>(N()/P.rbal)*w*P.gamR*mv(d)*P.slipR;       /* 조정 DV01(Γ) × 1억당 단가 */
const vegE=()=>-wEa()*P.vgE, vegR=()=>-wRa()*P.vgR;
const vegEp=()=>-wEp()*P.vgE, vegRp=()=>-wRp()*P.vgR;   /* 벤치마크선 = 계획 가중 */
const bsExp=()=>-(P.acovR/100)*P.mulR*P.bsdv;
const bsExpP=()=>-(P.covR/100)*P.bsdv;                    /* 계획 커버율로 생겼을 본드스왑 */
const volB=()=>Math.sqrt((1/12)/TEFF);
const teDriftY=()=>P.teAmt*P.teDft;
/* 보증수수료(억/년) = 적립금 × bp. 받는 돈이지만 비용과 같은 축에서 읽으려고 아래로 그어요 */
const gfeeY=()=>P.av*P.gfee;

/* ⭐ 장기평균선 = 세타 − 감마 − 슬리피지 − 캐리 + 추적오차 드리프트(확정) */
function benchY(k){
  k=k||1; const b=REG("base");
  return thP()-gYE(wEp(),b.dE*k)-gYR(wRp(),b.dR*k)-tcE(wEp(),b.dE*k)-tcR(wRp(),b.dR*k)-carry()+teDriftY();
}
/* 역스트레스 — 한도를 소진시키는 변동성 배수 */
function stressK(){
  const b=REG("base");
  const A=gYE(wEp(),b.dE)+gYR(wRp(),b.dR), B=tcE(wEp(),b.dE)+tcR(wRp(),b.dR);
  const Cc=carry()-thP()-teDriftY()-P.fee;
  if(A<=0) return B>0?Math.max(0,-Cc/B):9.99;
  const D=B*B-4*A*Cc; if(D<0) return 9.99;
  return Math.max(0,Math.min(9.99,(-B+Math.sqrt(D))/(2*A)));
}

/* ═══ 난수 — mulberry32. 구 LCG는 double 정밀도 초과로 주기 10,466에 붕괴했어요 ═══ */
let _s=0;
const seed=a=>{_s=a>>>0;};
const rnd=()=>{_s=_s+0x6D2B79F5|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const gauss=()=>{let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};

/* ═══ 데이터 ═══ */
async function load(){
  try{
    const r=await fetch("./data/market.json?v=1",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    S.mkt=await r.json();
  }catch(e){
    $("mainSvg").setAttribute("viewBox","0 0 360 60");
    $("mainSvg").innerHTML='<text x="8" y="26" font-size="11" font-weight="700" fill="#D6738A">시장데이터를 불러오지 못했어요</text>';
    return;
  }
  /* 실적 원장(선택) — 있으면 그날 총액이 실측으로 대체되고 차이는 미설명으로 잡혀요 */
  try{
    const r2=await fetch("./data/pnl.json?v=1",{cache:"no-store"});
    if(r2.ok){const j=await r2.json(); if(j&&Array.isArray(j.actual)&&j.actual.length) S.pnl=j;}
  }catch(e){ S.pnl=null; }

  const d=S.mkt, pe=[], pr=[];
  for(let i=1;i<d.eq.length;i++){
    pe.push((d.eq[i]/d.eq[i-1]-1)*100);
    pr.push(((d.y20[i]!=null&&d.y20[i-1]!=null)?(d.y20[i]-d.y20[i-1]):0)*100);
  }
  S.poolE=pe; S.poolR=pr;
  S.sdE=Math.sqrt(pe.reduce((a,b)=>a+b*b,0)/pe.length);
  S.sdR=Math.sqrt(pr.reduce((a,b)=>a+b*b,0)/pr.length);
  S.kAbsR=pr.reduce((a,b)=>a+Math.abs(b),0)/pr.length/S.sdR;   /* 실측 E|x|/σ — 정규 0.798 아님 */
  S.loaded=true; CURSOR=d.eq.length-1;
  build(); syncReg(); render();
}
function recentD(){
  const d=S.mkt, i1=CURSOR, i0=Math.max(1,i1-59); let se=0,sr=0,n=0;
  for(let i=i0;i<=i1;i++){
    const re=(d.eq[i]/d.eq[i-1]-1)*100, rr=((d.y20[i]!=null&&d.y20[i-1]!=null)?(d.y20[i]-d.y20[i-1]):0)*100;
    se+=re*re; sr+=rr*rr; n++;
  }
  return {dE:Math.sqrt(se/n), dR:Math.sqrt(sr/n)};
}
function regV(id){const r=REG(id);
  if(r.auto){const x=recentD();return {dE:x.dE,dR:x.dR,bs:r.bs,te:r.te};}
  return {dE:r.dE,dR:r.dR,bs:r.bs,te:r.te};}

/* ═══ 기간 ═══ */
function periodStart(){
  const d=S.mkt;
  if(VIEW==="ytd"){const y=d.dates[CURSOR].slice(0,4);
    for(let i=1;i<=CURSOR;i++) if(d.dates[i].slice(0,4)===y) return i;}
  if(VIEW==="cum"){for(let i=1;i<d.dates.length;i++) if(d.dates[i].slice(0,4)>=CUMY) return i<CURSOR-20?i:Math.max(1,CURSOR-PAST+1);}
  return Math.max(1,CURSOR-PAST+1);
}
function futLen(){
  if(VIEW!=="ytd") return MAXFUT;
  const s=S.mkt.dates[CURSOR];
  const cur=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)), end=new Date(+s.slice(0,4),11,31);
  return Math.max(5,Math.min(MAXFUT,Math.round((end-cur)/86400000*252/365)));
}
function ewma0(i0,key){
  const d=S.mkt; let v=0,n=0;
  for(let i=Math.max(1,i0-60);i<i0;i++){
    const x=key==="e"?(d.eq[i]/d.eq[i-1]-1)*100:((d.y20[i]!=null&&d.y20[i-1]!=null)?(d.y20[i]-d.y20[i-1])*100:0);
    v+=x*x; n++;
  }
  return n?v/n:1;
}

/* ═══ 실적 — 원장이 있으면 실측, 없으면 모형 재구성 ═══ */
const KEYS=["th","gE","gR","tE","tR","carry","vgE","vgR","bs","te"];
function realized(){
  const d=S.mkt, i1=CURSOR, i0=periodStart(), b=REG("base"), rg=regV(RSEL);
  const day=[], cum=[], bcum=[], parts={}, bparts={};
  KEYS.forEach(k=>{parts[k]=0;bparts[k]=0;});
  const thD=thA()/N(), cyD=carry()/N();
  const thDb=thP()/N(), teDb=teDriftY()/N();
  let vE=ewma0(i0,"e"), vR=ewma0(i0,"r");
  let ivE=Math.sqrt(vE)*(diE()/b.dE), ivR=Math.sqrt(vR)*(diR()/b.dR);
  let sprd=(d.y30[i0-1]-d.y10[i0-1])*100;   /* 구간 시작 실측 스프레드에서 출발 */
  let c=0, cb=0, accE=0, accR=0, k=0, resid=0, cov=0, sq=0, sqr=0;
  const led=S.pnl? new Map(S.pnl.actual.map(x=>[x.d,x])) : null;
  for(let i=i0;i<=i1;i++){
    const dt=d.dates[i];
    const re=(d.eq[i]/d.eq[i-1]-1)*100, rr=((d.y20[i]!=null&&d.y20[i-1]!=null)?(d.y20[i]-d.y20[i-1]):0)*100;
    vE=LAM*vE+(1-LAM)*re*re; vR=LAM*vR+(1-LAM)*rr*rr;
    const o={};
    o.th=thD; o.carry=-cyD;
    o.gE=-wEa()*0.5*P.gamE*re*re*vr(VRE,P.rbal);
    o.gR=-wRa()*0.5*P.gamR*rr*rr*vr(VRR,P.rbal);
    const nivE=Math.sqrt(vE)*(diE()/b.dE), nivR=Math.sqrt(vR)*(diR()/b.dR);
    const ivE0=ivE, ivR0=ivR;
    o.vgE=vegE()*(nivE-ivE)*volB(); o.vgR=vegR()*(nivR-ivR)*volB(); ivE=nivE; ivR=nivR;
    /* 본드스왑 스프레드 = IRS20 − 국고10. IRS20 가 없어 국고30 + 상수로 대용하면
       Δ = Δ(30−10) 이라 관측 커브로 바로 계산돼요. 실적 구간은 난수 없음 */
    const sprd0=sprd, ns=(d.y30[i]-d.y10[i])*100;
    o.bs=bsExp()*(ns-sprd); sprd=ns;
    o.te=P.teAmt*P.teDft/N();
    /* 벤치마크선 — 같은 시장에서 '계획대로 운용했다면' (평가 항목 없음) */
    const ob={};
    ob.th=thDb; ob.carry=-cyD; ob.te=teDb;
    ob.gE=-wEp()*0.5*P.gamE*re*re*vr(VRE,P.rbal);
    ob.gR=-wRp()*0.5*P.gamR*rr*rr*vr(VRR,P.rbal);
    ob.vgE=vegEp()*(nivE-ivE0)*volB(); ob.vgR=vegRp()*(nivR-ivR0)*volB();
    ob.bs=bsExpP()*(ns-sprd0);
    accE+=re; accR+=rr; k++; o.tE=0; o.tR=0; ob.tE=0; ob.tR=0;
    if(k>=P.rbal||i===i1){
      o.tE=-wEa()*100*P.gamE*Math.abs(accE)*P.slipE;
      o.tR=-wRa()*P.gamR*Math.abs(accR)*P.slipR;
      ob.tE=-wEp()*100*P.gamE*Math.abs(accE)*P.slipE;
      ob.tR=-wRp()*P.gamR*Math.abs(accR)*P.slipR;
      accE=0; accR=0; k=0;
    }
    KEYS.forEach(x=>{bparts[x]+=ob[x];}); cb+=KEYS.reduce((a,x)=>a+ob[x],0); bcum.push(cb);
    let pnl=KEYS.reduce((a,x)=>a+o[x],0);
    const L=led&&led.get(dt);
    if(L&&typeof L.total==="number"){
      KEYS.forEach(x=>{if(typeof L[x]==="number") o[x]=L[x];});
      resid+=L.total-KEYS.reduce((a,x)=>a+o[x],0); pnl=L.total; cov++;
    }
    KEYS.forEach(x=>{parts[x]+=o[x];});
    sq+=re*re; sqr+=rr*rr;
    c+=pnl; day.push({d:dt,re,rr,pnl,gm:-(o.gE+o.gR),sE:Math.sqrt(vE),sR:Math.sqrt(vR)}); cum.push(c);
  }
  return {day,cum,bcum,parts,bparts,end:c,bend:cb,n:day.length,sprd,resid,cov,
          sdE:Math.sqrt(sq/day.length), sdR:Math.sqrt(sqr/day.length),
          src:led?(cov===day.length?"real":(cov>0?"mix":"model")):"model"};
}


/* ═══ 장기평균선 밴드 — 기준 국면·계획 운용으로 과거를 되돌린 분포 ═══ */
const NB=500;
function pastBand(){
  const b=REG("base"), n=S.poolE.length, nP=RZ.n, i0=periodStart();
  const uE=wEp(), uR=wRp();
  const thD=thP()/N(), cyD=carry()/N();
  const v0E=ewma0(i0,"e"), v0R=ewma0(i0,"r");
  const paths=new Float64Array(NB*nP);
  seed(31337);
  for(let p=0;p<NB;p++){
    const z=gauss();
    const me=Math.exp(VOV*(0.4*z+0.92*gauss())-VOV*VOV), mr=Math.exp(VOV*(0.4*z+0.92*gauss())-VOV*VOV);
    let vE=v0E, vR=v0R, sprd=0, c=0, left=0, bi=0, accE=0, accR=0, k=0;
    let ivE=Math.sqrt(vE)*(diE()/b.dE), ivR=Math.sqrt(vR)*(diR()/b.dR);
    for(let t=0;t<nP;t++){
      if(left===0){bi=Math.floor(rnd()*n);left=BLK;}
      const j=(bi+(BLK-left))%n; left--;
      let re=S.poolE[j]*(b.dE/(S.sdE||1))*me, rr=S.poolR[j]*(b.dR/(S.sdR||3))*mr;
      if(re<-20)re=-20; else if(re>20)re=20;
      vE=LAM*vE+(1-LAM)*re*re; vR=LAM*vR+(1-LAM)*rr*rr;
      const nivE=Math.sqrt(vE)*(diE()/b.dE), nivR=Math.sqrt(vR)*(diR()/b.dR);
      const vg=vegEp()*(nivE-ivE)*volB()+vegRp()*(nivR-ivR)*volB(); ivE=nivE; ivR=nivR;
      const ns=0.988*sprd+b.bs/Math.sqrt(N())*gauss();   /* |Δ금리| 연동 제거 — 실측 상관 0.02 */
      const bs=bsExpP()*(ns-sprd); sprd=ns;
      const te=P.teAmt*(P.teDft/N()+b.te/Math.sqrt(N())*gauss());
      accE+=re; accR+=rr; k++;
      let tE=0, tR=0;
      if(k>=P.rbal){ tE=-uE*100*P.gamE*Math.abs(accE)*P.slipE;
                     tR=-uR*P.gamR*Math.abs(accR)*P.slipR; accE=0;accR=0;k=0; }
      c+=thD-cyD-uE*0.5*P.gamE*re*re*vr(VRE,P.rbal)-uR*0.5*P.gamR*rr*rr*vr(VRR,P.rbal)
        +vg+bs+te+tE+tR;
      paths[p*nP+t]=c;
    }
  }
  const q=(t,qs)=>{const a=new Float64Array(NB);for(let p=0;p<NB;p++)a[p]=paths[p*nP+t];a.sort();
    return qs.map(x=>{const f=(NB-1)*x,i=Math.floor(f);return i>=NB-1?a[NB-1]:a[i]+(a[i+1]-a[i])*(f-i);});};
  const last=new Float64Array(NB); for(let p=0;p<NB;p++) last[p]=paths[p*nP+nP-1];
  last.sort();
  const pctOf=v=>{let r=0; while(r<NB&&last[r]<v) r++; return r/NB*100;};
  return {q,pctOf,pct:pctOf(RZ.end)};
}

/* ═══ 전망 ═══ */
function forecast(start,np){
  np=np||NPATH;
  const b=REG("base"), rg=regV(RSEL), n=S.poolE.length;
  const tgE=t=>b.dE+(rg.dE-b.dE)*Math.exp(-t/TAU), tgR=t=>b.dR+(rg.dR-b.dR)*Math.exp(-t/TAU);
  const thD=thA()/N(), cyD=carry()/N();
  const v0E=ewma0(CURSOR+1,"e"), v0R=ewma0(CURSOR+1,"r"), s0=RZ?RZ.sprd:0;
  const paths=new Float64Array(np*FUT), A={}; KEYS.forEach(k=>A[k]=new Float64Array(FUT));
  seed(880517);
  for(let p=0;p<np;p++){
    /* 국면 배수 E[m²]=1 — 감마가 제곱항이라 E[m]=1 정규화는 감마를 13% 부풀려요.
       공통충격 로딩 0.4/0.92 → corr≈0.16 (실측 주가·금리 국면 순위상관 0.05) */
    const z=gauss();
    const me=Math.exp(VOV*(0.4*z+0.92*gauss())-VOV*VOV), mr=Math.exp(VOV*(0.4*z+0.92*gauss())-VOV*VOV);
    let vE=v0E, vR=v0R, sprd=s0;
    let ivE=Math.sqrt(vE)*(diE()/b.dE), ivR=Math.sqrt(vR)*(diR()/b.dR);
    let c=start, left=0, bi=0, accE=0, accR=0, k=0;
    const Cc={}; KEYS.forEach(x=>Cc[x]=0);
    for(let t=0;t<FUT;t++){
      if(left===0){bi=Math.floor(rnd()*n);left=BLK;}          /* 순환 블록 — 끝 구간 과소표집 방지 */
      const j=(bi+(BLK-left))%n; left--;
      let re=S.poolE[j]*(tgE(t)/(S.sdE||1))*me, rr=S.poolR[j]*(tgR(t)/(S.sdR||3))*mr;
      if(re<-20)re=-20; else if(re>20)re=20;                  /* 지수 CB — 하루 ±20% 초과는 제도적 불가 */
      vE=LAM*vE+(1-LAM)*re*re; vR=LAM*vR+(1-LAM)*rr*rr;
      const o={};
      o.th=thD; o.carry=-cyD;
      o.gE=-wEa()*0.5*P.gamE*re*re*vr(VRE,P.rbal);
      o.gR=-wRa()*0.5*P.gamR*rr*rr*vr(VRR,P.rbal);
      const nivE=Math.sqrt(vE)*(diE()/b.dE), nivR=Math.sqrt(vR)*(diR()/b.dR);
      o.vgE=vegE()*(nivE-ivE)*volB(); o.vgR=vegR()*(nivR-ivR)*volB(); ivE=nivE; ivR=nivR;
      const ns=0.988*sprd+rg.bs/Math.sqrt(N())*gauss();
      o.bs=bsExp()*(ns-sprd); sprd=ns;
      o.te=P.teAmt*(P.teDft/N()+rg.te/Math.sqrt(N())*gauss());
      accE+=re; accR+=rr; k++; o.tE=0; o.tR=0;
      if(k>=P.rbal){ o.tE=-wEa()*100*P.gamE*Math.abs(accE)*P.slipE;
                     o.tR=-wRa()*P.gamR*Math.abs(accR)*P.slipR; accE=0;accR=0;k=0; }
      for(let q=0;q<KEYS.length;q++){const x=KEYS[q]; Cc[x]+=o[x]; A[x][t]+=Cc[x]; c+=o[x];}
      paths[p*FUT+t]=c;
    }
  }
  const col=t=>{const a=new Float64Array(np);for(let p=0;p<np;p++)a[p]=paths[p*FUT+t];a.sort();return a;};
  const q=(t,qs)=>{const a=col(t);return qs.map(x=>{const f=(np-1)*x,i=Math.floor(f);
    return i>=np-1?a[np-1]:a[i]+(a[i+1]-a[i])*(f-i);});};
  const es=(t,x)=>{const a=col(t),m=Math.max(1,Math.floor(np*x));let s=0;for(let i=0;i<m;i++)s+=a[i];return s/m;};
  const attr=t=>{const o={};KEYS.forEach(k=>o[k]=A[k][t]/np);return o;};
  /* 연중 최초도달 — 한도는 경로 사건이지 종점 사건이 아니에요 */
  const breach=n0=>{let c2=0;
    for(let p=0;p<np;p++){for(let t=0;t<FUT;t++){ if(paths[p*FUT+t]< -P.fee*(n0+t+1)/N()){c2++;break;} }}
    return c2/np;};
  const endBreach=n0=>{let c2=0;const lim=-P.fee*(n0+FUT)/N();
    for(let p=0;p<np;p++) if(paths[p*FUT+FUT-1]<lim) c2++; return c2/np;};
  return {q,es,attr,breach,endBreach,paths,np};
}

function horizons(){
  const s=S.mkt.dates[CURSOR], y=+s.slice(0,4), m=+s.slice(4,6), dd=+s.slice(6,8);
  const dim=new Date(y,m,0).getDate();
  const eom=Math.max(3,Math.round((dim-dd)*252/365));
  const qd=Math.max(eom+5,Math.round(((Math.ceil(m/3)*3-m)+(dim-dd)/dim)*21));
  let H=[{k:"이달 말",t:eom},{k:"분기 말",t:qd},{k:"+6개월",t:126},{k:"+9개월",t:189},{k:"+12개월",t:251}];
  if(VIEW==="ytd"){H=H.filter(h=>h.t<FUT-6);H.push({k:"연말",t:FUT-1});}
  const seen=new Set();
  return H.map(h=>({k:h.k,t:Math.min(FUT-1,Math.max(1,h.t))}))
          .filter(h=>{if(seen.has(h.t))return false;seen.add(h.t);return true;}).sort((a,b)=>a.t-b.t);
}
function dstr(off){
  const s=S.mkt.dates[CURSOR];
  const dt=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));
  dt.setDate(dt.getDate()+Math.round(off*365/252));
  return String(dt.getFullYear()).slice(2)+"."+(dt.getMonth()+1)+"월";
}

function drawWF(){
  const f=RZ.n/N(), b=REG("base"), bench=benchY()*f;
  /* 시장 몫 = 실현변동성이 기준과 달라서 생긴 것 (통제 불가) */
  const mkt=[
    ["주가 감마",    RZ.bparts.gE+gYE(wEp(),b.dE)*f],
    ["금리 감마",    RZ.bparts.gR+gYR(wRp(),b.dR)*f],
    ["주가 베가",    RZ.bparts.vgE],
    ["금리 베가",    RZ.bparts.vgR],
    ["델타비용",     (RZ.bparts.tE+RZ.bparts.tR)+(tcE(wEp(),b.dE)+tcR(wRp(),b.dR))*f],
  ].filter(x=>Math.abs(x[1])>=0.5).sort((a,c)=>Math.abs(c[1])-Math.abs(a[1]));
  /* 운용 몫 = 같은 시장에서 계획과 다르게 운용해서 생긴 것 + 평가 (통제 가능) */
  const ops=[
    ["본드스왑",       RZ.parts.bs-RZ.bparts.bs],
    ["실제 델타비용",  (RZ.parts.tE+RZ.parts.tR)-(RZ.bparts.tE+RZ.bparts.tR)],
    ["펀드 추적오차",  RZ.parts.te-RZ.bparts.te],
    ["세타(노출차)",   RZ.parts.th-RZ.bparts.th],
    ["감마(노출차)",   (RZ.parts.gE+RZ.parts.gR)-(RZ.bparts.gE+RZ.bparts.gR)],
    ["베가(노출차)",   (RZ.parts.vgE+RZ.parts.vgR)-(RZ.bparts.vgE+RZ.bparts.vgR)],
  ].filter(x=>Math.abs(x[1])>=0.5).sort((a,c)=>Math.abs(c[1])-Math.abs(a[1]));
  const worst=[...mkt,...ops].reduce((a,x)=>Math.abs(x[1])>Math.abs(a[1])?x:a,["",0]);
  const pack=(arr,n)=>{const top=arr.slice(0,n), rest=arr.slice(n);
    const s=rest.reduce((a,x)=>a+x[1],0);
    return Math.abs(s)>=0.5? top.concat([[`그 외 ${rest.length}항목`,s]]) : top;};
  const rowsM=pack(mkt,5), rowsO=pack(ops,6);   /* 본드스왑까지 전부 보이게 */
  const seq=[["장기평균선",bench,1]]
    .concat(rowsM.length?[["h",`<span class="bdg sym">시장 몫</span> 변동성·내재변동성이 기준과 달랐어요`]]:[]).concat(rowsM.map(r=>[r[0],r[1],0]))
    .concat([["벤치마크선",RZ.bend,1]])
    .concat(rowsO.length?[["h",`<span class="bdg pay">운용 몫</span> 본드스왑 · 거래비용 · 추적오차 · 노출차`]]:[]).concat(rowsO.map(r=>[r[0],r[1],0]));
  if(Math.abs(RZ.resid)>=0.5) seq.push(["미설명",RZ.resid,0]);
  seq.push(["실적",RZ.end,1]);
  measure();
  let lo=0, hi=0;
  seq.forEach(s=>{ if(s[0]!=="h"){ lo=Math.min(lo,s[1]); hi=Math.max(hi,s[1]); } });
  /* 0 을 정가운데로 — 다른 막대(벤치마크 구성·실제 노출)와 축을 통일해요 */
  const M=Math.max(Math.abs(lo),Math.abs(hi))*1.06||10;
  lo=-M; hi=M;
  const pc=v=>(v-lo)/(hi-lo)*100;
  let html=`<div class="wax"><span>${won(lo)}</span><span style="opacity:.75">0</span><span>${won(hi)}</span></div>`;
  /* 모든 막대를 중앙 0 에서 뻗게 — 벤치마크 구성·실제 노출과 같은 읽는 법 */
  seq.forEach(s=>{
    if(s[0]==="h"){ html+=`<div class="wsec">${s[1]}</div>`; return; }
    const v=s[1], col=s[2]?"#16202F":(v>=0?"#4FAE8C":"#D69A55");
    const z=pc(0), w=Math.max(0.7,Math.abs(pc(v)-z)), left=v>=0?z:z-w;   /* 최소폭이 중앙선을 넘지 않게 */
    const tag=(!s[2]&&s[0]===worst[0]&&Math.abs(s[1])>=1)?` <span class="bdg bad">주범</span>`:``;
    html+=`<div class="wfr${s[2]?" an":""}"><div class="wl">${s[0]}${tag}</div>`+
      `<div class="wb"><u style="left:50%;background:#C7CEDC"></u>`+
      `<i style="left:${left.toFixed(2)}%;width:${w.toFixed(2)}%;background:${col};opacity:${s[2]?0.9:0.95}"></i></div>`+
      `<div class="wv" style="color:${s[2]?'var(--ink)':C(v)}">${s[2]?won(v):sgn(v)}</div></div>`;
  });
  $("wf").innerHTML=html;
  const dE=Math.sqrt(RZ.day.reduce((a,x)=>a+x.re*x.re,0)/RZ.n);
  const dR=Math.sqrt(RZ.day.reduce((a,x)=>a+x.rr*x.rr,0)/RZ.n);
  const t5=RZ.day.slice().sort((a,x)=>x.gm-a.gm).slice(0,5).reduce((a,x)=>a+x.gm,0);
  $("wfNote").innerHTML=`일변동 주가 <b>${dE.toFixed(2)}%</b>(기준 ${b.dE}, 감마 <b>${Math.pow(dE/b.dE,2).toFixed(1)}배</b>) · `+
    `금리 <b>${dR.toFixed(1)}bp</b>(기준 ${b.dR}, <b>${Math.pow(dR/b.dR,2).toFixed(1)}배</b>) · 상위 5일 <b>${(t5/Math.max(1e-9,-(RZ.parts.gE+RZ.parts.gR))*100).toFixed(0)}%</b>`+
    (Math.abs(RZ.resid)>=0.5?` · <b style="color:var(--bad-ink)">미설명 ${sgn(RZ.resid)}</b>`:``);
}

/* ── 공통 막대행 (워터폴과 같은 그리드) ── */
function barRows(items,unit){
  let mx=1; items.forEach(i=>{if(i[0]!=="h")mx=Math.max(mx,Math.abs(i[1]));});
  return items.map(it=>{
    if(it[0]==="h") return `<div class="wsec">${it[1]}</div>`;
    const v=it[1], w=Math.max(0.7,Math.abs(v)/mx*50), left=v>=0?50:50-w;
    return `<div class="wfr${it[3]?" an":""}"><div class="wl">${it[0]}</div>`+
      `<div class="wb"><u style="left:50%"></u>`+
      `<i style="left:${left.toFixed(2)}%;width:${Math.max(0.6,w).toFixed(2)}%;background:${v>=0?"#4FAE8C":"#D69A55"}"></i></div>`+
      `<div class="wv" style="color:${C(v)}">${sgn(v)}${unit||""}</div></div>`;
  }).join("");
}

    `<div class="cell"><div class="k">벤치마크</div><div class="v num" style="color:${C(RZ.bend)}">${won(RZ.bend)}</div><div class="s">같은 시장·계획 운용</div></div>`+
    `<div class="cell"><div class="k">실적</div><div class="v num" style="color:${C(RZ.end)}">${won(RZ.end)}</div><div class="s">일변동 ${dE.toFixed(2)}%</div></div>`+
    `<div class="cell"><div class="k">${VIEW==="ytd"?"연말":"1년 뒤"}</div><div class="v num" style="color:${C(y1)}">${won(y1)}</div><div class="s">ES95 ${won(FC.es(FUT-1,0.05))}</div></div>`;
  $("chartLab").textContent=`${VIEW==="ytd"?S.mkt.dates[CURSOR].slice(0,4)+"년":VIEW==="cum"?CUMY+"년~":"12개월"} · ${RZ.n}일`;
}
function fillCtx(){
  const asof=S.mkt.dates[CURSOR], last=S.mkt.dates[S.mkt.dates.length-1];
  const badge=RZ.src==="real"?`<span class="src real">실측 원장</span>`
            :RZ.src==="mix"?`<span class="src real">실측 ${RZ.cov}일</span><span class="src model">+모형</span>`
            :`<span class="src model">모형 재구성</span>`;
  $("ctxWho").innerHTML=`<b>${fmtd(asof)}</b>`+(asof!==last?`<span class="src assume">과거 재생</span>`:``)+
    `<b>${REG(RSEL).n}</b>${badge}`;
}
/* 시장 몫이 어디서 왔는지 — 감마는 변동성의 제곱으로 들어와요 */
function fillVol(){
  if(!RZ) return;
  const b=REG("base"), kE=RZ.sdE/b.dE, kR=RZ.sdR/b.dR, f=x=>x.toFixed(2);
  $("volCtx").innerHTML=
    `구간 평균 일변동 <b>주가 ${RZ.sdE.toFixed(2)}%</b> <span class="bdg${kE>1?" pay":""}">기준 ×${f(kE)}</span>`+
    ` · <b>금리 ${RZ.sdR.toFixed(1)}bp</b> <span class="bdg${kR>1?" pay":""}">기준 ×${f(kR)}</span>`;
  /* 금리는 레벨·커브도 같이 봐야 해요 — 방향은 델타가 먹으니 손익엔 안 나오지만
     장단기 스프레드가 벌어지면 20년 하나로 잰 노출과 실제가 어긋납니다 */
  {const d=S.mkt, i1=CURSOR, i0=periodStart(), bp=(a,b)=>Math.round((a-b)*100);
   const d20=bp(d.y20[i1],d.y20[i0]), s21=bp(d.y20[i1]-d.y10[i1],d.y20[i0]-d.y10[i0]),
         s32=bp(d.y30[i1]-d.y20[i1],d.y30[i0]-d.y20[i0]);
   $("rateCtx").innerHTML=`금리 <b>20년 ${d.y20[i1].toFixed(2)}%</b> <span class="bdg${d20>0?" pay":""}">구간 ${sgn(d20)}bp</span>`+
     ` · 커브 <b>20−10</b> <span class="bdg${Math.abs(s21)>10?" leak":""}">${sgn(s21)}bp</span>`+
     ` <b>30−20</b> <span class="bdg${Math.abs(s32)>10?" leak":""}">${sgn(s32)}bp</span>`+
     ` · 본드스왑 <b>${sgn(bp(d.y30[i1]-d.y10[i1],d.y30[i0]-d.y10[i0]))}bp</b>`+
     ` <span class="bdg ink">IRS20≈국고30 대용</span>`;
   /* 주가와 같이 움직이면 두 감마가 같은 날 터져요 — 전망 밴드는 같은 날짜로 뽑아 이미 반영 */
   let sa=0,sb=0,sab=0,sa2=0,sb2=0; const nn=RZ.n;
   RZ.day.forEach(x=>{sa+=x.re;sb+=x.rr;sab+=x.re*x.rr;sa2+=x.re*x.re;sb2+=x.rr*x.rr;});
   const cor=(nn*sab-sa*sb)/Math.sqrt(Math.max(1e-9,(nn*sa2-sa*sa)*(nn*sb2-sb*sb)));
   $("rateCtx").innerHTML+=`<br>주가·금리 상관 <b>${cor>=0?"+":"−"}${Math.abs(cor).toFixed(2)}</b>`+
     `<span class="bdg${cor<-0.25?" leak":" ink"}">${cor<-0.25?"주가 하락 = 금리 상승 · 두 감마 동시":cor>0.25?"동반 상승":"거의 무관"}</span>`;}
  /* 손실이 변동성 탓인지 포지션 크기 탓인지 — 기준 국면에서도 나갔을 몫과 갈라요 */
  const fr=RZ.n/N();
  const row=(nm,base,act,tag)=>{const ex=act-base;
    return `<tr><td><b>${nm}</b></td><td class="r">${SE(base)}</td><td class="r"><b>${SE(act)}</b></td>`+
      `<td class="r" style="color:${C(ex)}">${SE(ex)}</td>`+
      `<td class="r"><span class="bdg${tag==="크기"?" ink":" pay"}">${tag||(Math.abs(ex)>Math.abs(base)?"변동성":"크기")}</span></td></tr>`;};
  $("axSplit").innerHTML=`<table><thead><tr><th style="text-align:left">축</th><th class="r">기준 국면</th>`+
    `<th class="r">실제</th><th class="r">차이</th><th class="r">주원인</th></tr></thead><tbody>`+
    row("주가 감마·슬립", -(gYE(wEa(),b.dE)+tcE(wEa(),b.dE))*fr, RZ.parts.gE+RZ.parts.tE)+
    row("금리 감마·슬립", -(gYR(wRa(),b.dR)+tcR(wRa(),b.dR))*fr, RZ.parts.gR+RZ.parts.tR)+
    /* 커버하면 감마가 줄어드는 대신 베이시스가 생겨요 — 이 행이 없으면 '금리 위험이 줄었다' 로 읽힙니다 */
    row("본드스왑", 0, RZ.parts.bs, "방향")+
    `</tbody></table>`;
}
/* 실현 변동성 서브차트 — 메인과 같은 x축. 감마는 σ² 이라 ×2 면 비용은 ×4 예요 */
function drawVol(){
  if(!RZ||!XS) return;
  const {X,L,iw,nP}=XS, H=MOB?86:96, T=6, B=16, ih=H-T-B, R=12, b=REG("base"), g=[];
  const kE=i=>RZ.day[i].sE/b.dE, kR=i=>RZ.day[i].sR/b.dR;
  let hi=1.2; for(let i=0;i<nP;i++) hi=Math.max(hi,kE(i),kR(i));
  hi=Math.ceil(hi*2)/2;
  const Y=v=>T+ih*(1-v/hi);
  [1,2,3,4,5].filter(v=>v<=hi).forEach(v=>{
    g.push(`<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}" stroke="${v===1?"#AAB4C6":"#EDF0F6"}" stroke-width="1" ${v===1?'stroke-dasharray="4 3"':""}/>`);
    g.push(MOB?`<text x="${L+2}" y="${(Y(v)-2).toFixed(1)}" font-size="9" fill="#98A2B3">×${v}</text>`
              :`<text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#8A94A6">×${v}</text>`);
  });
  [[kE,"#4A6FC4","주가"],[kR,"#A96A1C","금리"]].forEach(([f,col,nm])=>{
    let d="M"; for(let i=0;i<nP;i++) d+=`${X(i).toFixed(1)},${Y(Math.min(hi,f(i))).toFixed(1)} `;
    g.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>`);
    g.push(`<text x="${(X(nP-1)+3).toFixed(1)}" y="${(Y(Math.min(hi,f(nP-1)))+3.5).toFixed(1)}" font-size="9.5" font-weight="700" fill="${col}">${nm} 현재 ×${f(nP-1).toFixed(1)}</text>`);
  });
  g.push(`<line x1="${X(nP-1).toFixed(1)}" y1="${T}" x2="${X(nP-1).toFixed(1)}" y2="${T+ih}" stroke="#AAB4C6" stroke-width="1"/>`);
  g.push(`<text x="${L}" y="${H-4}" font-size="9.5" font-weight="700" fill="#8A94A6">일별 변동성 EWMA (기준 국면 대비 배수) · 감마는 이 값의 제곱으로</text>`);
  const el=$("volSvg"); el.setAttribute("viewBox",`0 0 ${W} ${H}`); el.setAttribute("height",H); el.innerHTML=g.join("");
}
function fillSel(){
  $("lineSel").innerHTML=[["band","기준 밴드","#8A94A6"],["bench","벤치마크선","#5B4CA8"]]
    .concat(VIEW==="ytd"?[["plan","경영계획선","#D6738A"],["gfee","보증수수료선","#337A5F"]]:[])   /* 계획선은 당해 뷰에만 있어요 */
    .map(a=>`<button class="chip${SHOW[a[0]]?" on":""}" data-ln="${a[0]}">`+
      `<span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${a[2]};margin-right:5px"></span>${a[1]}</button>`).join("");
  $("selRow").innerHTML=
    VIEWS.map(v=>`<button class="chip${v.id===VIEW?" on":""}" data-vw="${v.id}">${v.n}</button>`).join("")+
    `<span style="width:9px"></span>`+
    REGS.map(r=>`<button class="chip${r.id===RSEL?" on":""}" data-rs="${r.id}">${r.n}</button>`).join("");
}
function fillNotes(){
  $("regNote").innerHTML=`<b>${REG(REDIT).n}</b> 편집 중 · ${REG(REDIT).q}`+
    (REG(REDIT).auto?` · 실측 고정`:``)+` · 「기준」=장기평균선 감마 · 고른 국면=전망 출발점`;
  $("limitNote").innerHTML=`단일 숏풋 근사 · Γ 상수(급락 시 감마 증가 미반영) · 크로스감마·계약자행동 없음 · `+
    `본드스왑·추적오차는 가정 경로`;
}
function fillRegTbl(){
  $("regTbl").innerHTML=`<tr><th>국면</th><th>주가</th><th>금리</th><th>본드스왑</th><th>추적오차</th><th>감마 <span style="font-weight:400">억/년</span></th></tr>`+
    REGS.map(x=>{const w=regV(x.id), gm=gYE(wEa(),w.dE)+gYR(wRa(),w.dR), on=x.id===RSEL;
      return `<tr style="${on?'background:var(--pay-bg)':''}"><td><b>${x.n}</b>${on?' <span class="bdg pay">전망</span>':''}</td>`+
        `<td>${w.dE.toFixed(2)}%</td><td>${w.dR.toFixed(1)}bp</td><td>${(+w.bs).toFixed(0)}bp</td><td>${(+w.te).toFixed(1)}%</td>`+
        `<td style="color:var(--bad-ink);font-weight:700">−${won(gm)}</td></tr>`;}).join("");
}

/* ═══ 컨트롤 ═══ */
function nf(p){
  return `<div class="nf"><label>${p.n}<small>${p.s||""}</small></label>`+
    `<div class="row"><button type="button" data-dec="${p.id}">−</button>`+
    `<input type="number" inputmode="decimal" id="f_${p.id}" value="${P[p.id]!==undefined?P[p.id]:0}" step="${p.st}">`+
    `<button type="button" data-inc="${p.id}">+</button><span class="u">${p.u}</span></div></div>`;
}
function build(){
  $("regSel").innerHTML=REGS.map(r=>`<button class="chip${r.id===REDIT?" on":""}" data-re="${r.id}">${r.n}</button>`).join("");
  $("regNums").innerHTML=
    nf({id:"R_dE",n:"주가 일변동",u:"%",st:0.05,s:"하루 등락폭"})+
    nf({id:"R_dR",n:"금리 일변동",u:"bp",st:0.1,s:"하루 변동"})+
    nf({id:"R_bs",n:"본드스왑 변동",u:"bp/년",st:1,s:"연간 폭"})+
    nf({id:"R_te",n:"펀드 추적오차",u:"%/년",st:0.1,s:"지수 이탈 연σ"});
  const slHTML=tb=>{let h="",cur="";
    PAR.filter(p=>p.k==="s"&&p.tb===tb).forEach(p=>{
      if(p.g!==cur){cur=p.g;h+=`<div class="grp2${h?"":" first"}">${p.g} <span class="bdg ${tb==="b"?"pay":"good"}">${tb==="b"?"계획":"실제"}</span></div>`;}
      h+=`<div class="sl"><label for="s_${p.id}"><span>${p.n}</span><b><span id="v_${p.id}">${P[p.id]}</span> ${p.u}</b></label>`+
         (p.s?`<small>${p.s}</small>`:``)+
         `<input type="range" id="s_${p.id}" min="${p.mn}" max="${p.mx}" step="${p.st}" value="${P[p.id]}"></div>`;
    });
    return h;};
  const nmHTML=tb=>{let h="",cur="";
    PAR.filter(p=>p.k==="n"&&p.tb===tb).forEach(p=>{
      if(p.g!==cur){ if(cur)h+=`</div>`; cur=p.g; h+=`<div class="grp2${h?"":" first"}">${p.g} <span class="bdg ${tb==="b"?"pay":"good"}">${tb==="b"?"계획":"실제"}</span></div><div class="nums">`; }
      h+=nf(p);
    });
    return cur?h+`</div>`:h;};
  $("slSel").innerHTML=slHTML("r"); $("slB").innerHTML=slHTML("b");
  $("numSel").innerHTML=nmHTML("b"); $("numR").innerHTML=nmHTML("r");
  $("curQuick").innerHTML=[["now","📍 최근"],["m3","3개월 전"],["m6","6개월 전"],["y1","1년 전"]]
    .map(a=>`<button class="chip" data-cq="${a[0]}">${a[1]}</button>`).join("");
  $("v_cursor").textContent=fmtd(S.mkt.dates[CURSOR]);
  $("curSel").innerHTML=`<input type="range" id="s_cursor" min="${PAST}" max="${S.mkt.dates.length-1}" step="1" value="${CURSOR}" style="margin-top:4px">`;

  document.addEventListener("click",e=>{
    const re=e.target.closest("[data-re]");
    if(re){REDIT=re.dataset.re;
      document.querySelectorAll("[data-re]").forEach(b=>b.classList.toggle("on",b.dataset.re===REDIT));
      syncReg(); render(); return;}
    const rs=e.target.closest("[data-rs]"); if(rs){RSEL=rs.dataset.rs; render(); return;}
    const vw=e.target.closest("[data-vw]"); if(vw){VIEW=vw.dataset.vw; render(); return;}
    const ln=e.target.closest("[data-ln]"); if(ln){SHOW[ln.dataset.ln]=SHOW[ln.dataset.ln]?0:1; render(); return;}
    const cq=e.target.closest("[data-cq]");
    if(cq){const last=S.mkt.dates.length-1, back={now:0,m3:63,m6:126,y1:252}[cq.dataset.cq]||0;
      CURSOR=Math.max(PAST,last-back); $("s_cursor").value=CURSOR;
      $("v_cursor").textContent=fmtd(S.mkt.dates[CURSOR]); syncReg(); render(); return;}
    const inc=e.target.closest("[data-inc]"), dec=e.target.closest("[data-dec]");
    if(inc||dec){const id=(inc||dec).dataset[inc?"inc":"dec"], el=$("f_"+id);
      if(el&&!el.disabled){const st=+el.step||1; const nv=+((+el.value+(inc?st:-st)).toFixed(6));
        el.value=nv; setP(id,nv);} }
  });
  document.addEventListener("input",e=>{
    const t=e.target; if(!t.id)return;
    if(t.id.indexOf("f_")===0) setP(t.id.slice(2),+t.value);
    else if(t.id==="s_cursor"){CURSOR=+t.value; $("v_cursor").textContent=fmtd(S.mkt.dates[CURSOR]); syncReg(); render(true);}
    else if(t.id.indexOf("s_")===0){const id=t.id.slice(2); P[id]=+t.value;
      const l=$("v_"+id); if(l)l.textContent=P[id]; render(true);}
  });
  document.addEventListener("change",e=>{ if(e.target.id&&e.target.id.indexOf("s_")===0) render(); });
  TABS.forEach(k=>$("tb_"+k).addEventListener("click",()=>tab(k)));
  const sv=$("mainSvg");
  sv.addEventListener("pointermove",onMove); sv.addEventListener("pointerleave",onLeave);
  sv.addEventListener("touchmove",onMove,{passive:true});
  if(window.ResizeObserver) new ResizeObserver(()=>{if(S.loaded)render();}).observe(sv);
}
function setP(id,v){
  if(isNaN(v))return;
  if(id.indexOf("R_")===0){
    const r=REG(REDIT), key=id.slice(2);
    if(r.auto&&(key==="dE"||key==="dR"))return;
    r[key]=v;
  } else P[id]=v;
  render();
}
function syncReg(){
  const w=regV(REDIT), r=REG(REDIT);
  [["R_dE",w.dE],["R_dR",w.dR],["R_bs",w.bs],["R_te",w.te]].forEach(a=>{
    const el=$("f_"+a[0]);
    if(el){el.value=+(+a[1]).toFixed(2); el.disabled=!!(r.auto&&(a[0]==="R_dE"||a[0]==="R_dR"));}
  });
}
const TABS=["m","f","b","r"];
function tab(w){
  TAB=w;
  TABS.forEach(k=>{$("tb_"+k).classList.toggle("on",k===w); $("pg_"+k).classList.toggle("on",k===w);});
  window.scrollTo({top:0,behavior:"smooth"});
  render();
}
load();
</script>
